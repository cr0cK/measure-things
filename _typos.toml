# release-please links each changelog entry to its short commit hash, and typos reads hex runs
# such as the "baed" in 1baed4a as misspelled words.
# Spec rule IDs, such as `FND-3`, use three-letter section codes that are not words.
[default]
extend-ignore-re = [
    "\\[[0-9a-f]{7}\\]\\(https://github\\.com/[^)]+/commit/[0-9a-f]{40}\\)",
    "\\b[A-Z]{3}-[0-9]+\\b",
]
